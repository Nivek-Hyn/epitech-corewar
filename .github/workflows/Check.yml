name: corewar_workflow

on:
  push:
    branches-ignore:
      - "ga-ignore-*"
env:
    EXECUTABLES: "corewar"
jobs:
  check_coding_style:
    runs-on: ubuntu-latest
    container: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Lancer l'analyse de style
        run: check.sh $(pwd) $(pwd)

      - name: Vérifier les erreurs de style
        run: |
          if [ -s coding-style-reports.log ]; then
            echo "::error ::Erreurs de style détectées !"
            exit 1
          fi
  check_program_compilation:
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: check_coding_style
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Compiler le projet
        run: timeout 120s make

      - name: Nettoyer le projet
        run: make clean

      - name: Vérifier les exécutables
        run: |
          if [ ! -x "$EXECUTABLES" ]; then
            echo "::error ::L'exécutable $EXECUTABLES est manquant ou non-exécutable !"
            exit 1
          fi
  run_tests:
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: check_program_compilation
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Exécuter les tests
        run: timeout 120s make test
